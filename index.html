<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapi - Deutsch B2</title>
    
    <!-- Gọi 3 "bộ não" của Kapi (thêm defer để tránh lỗi Timeout) -->
    <script src="vokabel-data.js" defer></script>
    <script src="horen-data.js" defer></script>
    <script src="kapi-logic.js" defer></script>
    
    <style>
        /* TẠO LỚP NỀN CUTE */
        body {
            background-image: url('bg-pattern.jpg') !important;
            background-repeat: repeat !important;
            background-size: 300px !important;
            background-attachment: fixed !important;
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding-bottom: 50px;
        }

        body::before {
            content: "" !important;
            position: fixed !important;
            top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important;
            background: rgba(255, 255, 255, 0.7) !important;
            z-index: -1 !important;
        }

        /* ========================================= */
        /* WIDGET GÓC PHẢI & TRÁI (LEAF & SHOP)      */
        /* ========================================= */
        .widget-panel {
            position: fixed;
            top: 20px;
            background-color: #fff9e6;
            border: 2px solid #f4d03f;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 100;
            max-width: 200px;
        }
        
        .widget-right { right: 20px; text-align: center; }
        .widget-left { left: 20px; text-align: left; }

        .total-leaves { font-weight: bold; margin-bottom: 10px; color: #27ae60; font-size: 16px; }
        .leaves-container { display: flex; justify-content: center; gap: 5px; margin: 10px 0; font-size: 18px; }
        
        .btn-action {
            background-color: #4CAF50; color: white; border: none; padding: 8px 12px;
            border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s;
        }
        .btn-action:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-action:hover:not(:disabled) { background-color: #45a049; }

        /* SHOP ITEMS */
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; border: 1px solid #ddd; padding: 5px 10px;
            border-radius: 8px; margin-bottom: 8px; font-size: 14px;
        }
        .shop-item button {
            background: #ffb74d; border: none; border-radius: 5px; padding: 4px 8px;
            cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s;
        }
        .shop-item button:disabled { background: #eee; color: #999; cursor: not-allowed; }
        .shop-item button.equipped { background: #4CAF50; color: white; }

        /* ========================================= */
        /* HIỆU ỨNG KAPI NHÚN NHẢY & PHỤ KIỆN        */
        /* ========================================= */
        .kapi-container {
            position: relative; display: inline-block; cursor: pointer; margin: 20px 0;
        }
        .kapi-img {
            width: 300px; max-width: 90%; height: auto;
            mix-blend-mode: multiply !important;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .kapi-container:hover .kapi-img { transform: translateY(-15px) scale(1.02); }

        /* Đồ trang bị trên đầu/mắt */
        .kapi-head {
            position: absolute; top: 0px; left: 50%; transform: translateX(-50%);
            font-size: 40px; z-index: 10; transition: 0.3s; pointer-events: none;
        }
        .kapi-accessory {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            font-size: 60px; z-index: 11; pointer-events: none; display: none;
        }

        /* Bong bóng thoại "Hallo" */
        .kapi-bubble {
            position: absolute; top: 10px; right: -40px;
            background-color: transparent; border: 3px solid #ffb74d; border-radius: 20px;
            padding: 10px 20px; font-size: 22px; font-weight: bold; color: #d35400;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15); z-index: 10;
            opacity: 0; visibility: hidden; transform: translateY(20px) scale(0.8);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .kapi-bubble::after {
            content: ""; position: absolute; bottom: -12px; right: 40px;
            border-width: 12px 12px 0; border-style: solid; border-color: #ffb74d transparent transparent transparent;
        }
        .kapi-bubble::before {
            content: ""; position: absolute; bottom: -8px; right: 40px; z-index: 1;
            border-width: 12px 12px 0; border-style: solid; border-color: white transparent transparent transparent;
        }
        .kapi-container:hover .kapi-bubble { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

        /* ========================================= */
        /* CÁC THÀNH PHẦN KHÁC                       */
        /* ========================================= */
        .btn-kapi { font-size:22px; padding:15px 25px; margin:10px; border-radius:20px; border:none; cursor:pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; color: #333; }
        .btn-kapi:hover { transform: translateY(-2px); box-shadow: 0 6px 10px rgba(0,0,0,0.1); }
        #feedback-area { display:none; max-width:800px; width:90%; margin:10px auto; padding:20px; background-color:#f5f5f5; border-radius:12px; text-align:left; border: 1px solid #ddd; }
        
        @media (max-width: 800px) {
            .widget-panel { position: static; max-width: 90%; margin: 10px auto; display: flex; flex-direction: column; align-items: center; }
            .shop-item { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <!-- WIDGET GÓC TRÁI: CỬA HÀNG THỜI TRANG KAPI -->
    <div id="shop-widget" class="widget-panel widget-left">
        <h3 style="margin-top: 0; color: #d35400; text-align: center;">Kapi Shop 🛍️</h3>
        <div id="shop-items-container">
            <!-- Render bằng JS -->
        </div>
    </div>

    <!-- WIDGET GÓC PHẢI: ĐIỂM DANH & CHUỖI LÁ -->
    <div id="leaf-widget" class="widget-panel widget-right">
        <div class="total-leaves">💰 Ví: <span id="total-leaves-count">0</span> 🍃</div>
        <div style="font-size: 14px; font-weight: bold; color: #555;">Chuỗi học tuần này:</div>
        <div id="leaves-container" class="leaves-container">
            <span class="leaf" id="day-1">🍂</span>
            <span class="leaf" id="day-2">🍂</span>
            <span class="leaf" id="day-3">🍂</span>
            <span class="leaf" id="day-4">🍂</span>
            <span class="leaf" id="day-5">🍂</span>
            <span class="leaf" id="day-6">🍂</span>
            <span class="leaf" id="day-7">🍂</span>
        </div>
        <button id="btn-claim-leaf" class="btn-action" onclick="claimDailyLeaf()">🌿 Điểm danh ngay</button>
    </div>

    <!-- CONTAINER BẢO VỆ CHÍNH -->
    <div id="container">
        <h1>Hallo! Ich bin Kapi 🦫</h1>
        
        <!-- KAPI VÀ BONG BÓNG THOẠI -->
        <div class="kapi-container">
            <div class="kapi-bubble">Hallo! 👋</div>
            <div id="kapi-head-item" class="kapi-head">🍊</div>
            <div id="kapi-accessory" class="kapi-accessory">😎</div>
            <img src="capy.png" class="kapi-img" alt="Bé Kapi dễ thương">
        </div>
        
        <p id="message" style="font-size:30px; margin:20px;">Guten Morgen! Schön, dich kennenzulernen! 🌟</p>
        <p id="timer" style="font-size:40px; color:#e67e22; font-weight:bold; margin: 0;"></p>

        <div id="feedback-area"></div>

        <div id="buttons">
            <button class="btn-kapi" style="background:#4CAF50; color:white;" onclick="sayHallo()">👋 Hallo Kapi</button>
        </div>

        <!-- BỘ ĐẾM LƯỢT TRUY CẬP -->
        <div style="text-align: center; margin-top: 40px; margin-bottom: 20px; padding: 10px;">
            <p style="font-size: 14px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px;">👀 Số lượt ghé thăm bé Kapi:</p>
            <span style="font-family: Arial, sans-serif; font-size: 14px; background: #555; color: white; padding: 4px 8px; border-radius: 4px 0 0 4px;">Profile views</span><span id="fake-views" style="font-family: Arial, sans-serif; font-size: 14px; background: #fe7d37; color: white; padding: 4px 8px; border-radius: 0 4px 4px 0;">...</span>
        </div>
    </div> 

    <!-- GIAO DIỆN TRANG TRANSCRIPT (Giữ nguyên của Vịt) -->
    <div id="transcript-page" style="display: none; padding: 20px; max-width: 800px; margin: 0 auto; background: #fffaf0; min-height: 100vh; font-family: sans-serif;">
        <button onclick="closeTranscriptPage()" style="background: #fdf2f8; border: 2px solid #fbcfe8; padding: 10px 20px; border-radius: 20px; color: #db2777; font-weight: bold; cursor: pointer; margin-bottom: 20px;">
            ⬅️ Quay lại kết quả
        </button>
        <h2 id="transcript-title" style="color: #2c3e50; text-align: center; margin-bottom: 20px;"></h2>
        <div style="text-align: center; margin-bottom: 30px;">
            <audio id="transcript-audio" controls style="width: 100%; max-width: 500px;"></audio>
        </div>
        <div id="transcript-text" style="background: #fff; padding: 30px; border-radius: 16px; border: 1px solid #ffe4e1; box-shadow: 0 4px 15px rgba(0,0,0,0.03); font-size: 16px; line-height: 1.8; color: #4b5563; text-align: justify; white-space: pre-line; margin-bottom: 20px;">
        </div>
        <div style="background: #fff; padding: 20px; border-radius: 16px; border: 2px dashed #fbcfe8;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #fbcfe8; padding-bottom: 10px; margin-bottom: 10px;">
                <h3 style="margin: 0; color: #db2777; font-size: 18px;">📝 Ghi chú từ vựng</h3>
                <button onclick="clearTranscriptNote()" style="background: #fee2e2; border: none; padding: 6px 12px; border-radius: 8px; color: #ef4444; cursor: pointer; font-size: 13px; font-weight: bold;">🗑️ Xóa hết</button>
            </div>
            <textarea id="transcript-note" oninput="saveTranscriptNote()" placeholder="Vịt gõ từ mới, cấu trúc hay vào đây nhé..." style="width: 100%; min-height: 150px; border: none; outline: none; resize: vertical; font-size: 16px;"></textarea>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- JAVASCRIPT: LOGIC ĐẾM LÁ & SHOP THỜI TRANG                                -->
    <!-- ========================================================================= -->
    <script>
        // --- 1. BIẾN CẤU HÌNH & DỮ LIỆU ---
        const STORAGE_KEY = 'kapi_eco_system';
        
        let sysData = {
            totalLeaves: 0,
            weeklyStreak: 0,
            lastClaimDate: null,
            currentWeekStart: getMonday(new Date()).toDateString(),
            inventory: [], // Mảng chứa ID đồ đã mua
            equippedItem: null // Đồ đang mặc
        };

        // Danh sách vật phẩm trong Shop
        const shopItems = [
            { id: "item_glass", name: "Kính râm 😎", price: 5, emoji: "😎", type: "face" },
            { id: "item_bow", name: "Nơ xinh 🎀", price: 10, emoji: "🎀", type: "head" },
            { id: "item_flower", name: "Hoa cài 🌸", price: 15, emoji: "🌸", type: "head" }
        ];

        // --- 2. HÀM XỬ LÝ NGÀY THÁNG ---
        function getMonday(d) {
            let date = new Date(d);
            let day = date.getDay();
            let diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        // --- 3. KHỞI TẠO HỆ THỐNG KHI LOAD ---
        function initSystem() {
            let savedData = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (savedData) sysData = { ...sysData, ...savedData };
            
            checkResetWeek();
            renderLeavesUI();
            renderShopUI();
            updateKapiAppearance();
        }

        function checkResetWeek() {
            const thisMonday = getMonday(new Date()).toDateString();
            if (sysData.currentWeekStart !== thisMonday) {
                sysData.weeklyStreak = 0;
                sysData.currentWeekStart = thisMonday;
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sysData));
        }

        // --- 4. LOGIC ĐIỂM DANH NHẬN LÁ ---
        function claimDailyLeaf() {
            const todayStr = new Date().toDateString();
            if (sysData.lastClaimDate === todayStr) return;

            if (sysData.weeklyStreak < 7) sysData.weeklyStreak += 1;
            sysData.totalLeaves += 1;
            sysData.lastClaimDate = todayStr;
            
            saveData();
            renderLeavesUI();
            renderShopUI();
            updateKapiAppearance();
        }

        function renderLeavesUI() {
            document.getElementById('total-leaves-count').innerText = sysData.totalLeaves;

            for (let i = 1; i <= 7; i++) {
                const leaf = document.getElementById(`day-${i}`);
                leaf.innerText = (i <= sysData.weeklyStreak) ? "🌿" : "🍂";
            }

            const btnClaim = document.getElementById('btn-claim-leaf');
            if (sysData.lastClaimDate === new Date().toDateString()) {
                btnClaim.disabled = true;
                btnClaim.innerText = "Đã điểm danh";
            } else {
                btnClaim.disabled = false;
                btnClaim.innerText = "🌿 Điểm danh ngay";
            }
        }

        // --- 5. LOGIC SHOP & MẶC ĐỒ ---
        function renderShopUI() {
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';

            shopItems.forEach(item => {
                const isOwned = sysData.inventory.includes(item.id);
                const isEquipped = sysData.equippedItem === item.id;
                const canAfford = sysData.totalLeaves >= item.price;

                let btnHTML = '';
                if (isEquipped) {
                    btnHTML = `<button class="equipped" onclick="equipItem('${item.id}')">Đang mặc</button>`;
                } else if (isOwned) {
                    btnHTML = `<button onclick="equipItem('${item.id}')">Mặc</button>`;
                } else {
                    btnHTML = `<button ${!canAfford ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price})">
                                ${canAfford ? 'Mua (' + item.price + ' 🍃)' : '🔒 ' + item.price + ' 🍃'}
                               </button>`;
                }

                container.innerHTML += `
                    <div class="shop-item">
                        <span>${item.name}</span>
                        ${btnHTML}
                    </div>
                `;
            });
        }

        function buyItem(id, price) {
            if (sysData.totalLeaves >= price) {
                sysData.totalLeaves -= price;
                sysData.inventory.push(id);
                saveData();
                renderLeavesUI();
                renderShopUI();
            }
        }

        function equipItem(id) {
            if (sysData.equippedItem === id) {
                sysData.equippedItem = null; // Cởi ra nếu đang mặc
            } else {
                sysData.equippedItem = id; // Mặc vào
            }
            saveData();
            renderShopUI();
            updateKapiAppearance();
        }

        function updateKapiAppearance() {
            const headItem = document.getElementById('kapi-head-item');
            const accItem = document.getElementById('kapi-accessory');
            const isSunday = new Date().getDay() === 0;

            // Xử lý Easter Egg Chủ Nhật 7 lá
            if (isSunday && sysData.weeklyStreak === 7) {
                headItem.innerText = "👑";
                headItem.style.display = "block";
                headItem.style.animation = "bounce 1s infinite alternate";
            } else {
                headItem.innerText = "🍊";
                headItem.style.display = "block";
                headItem.style.animation = "none";
            }

            // Xử lý mặc đồ Shop (Nghiêm cấm che mất vương miện)
            if (sysData.equippedItem) {
                const itemDef = shopItems.find(i => i.id === sysData.equippedItem);
                if (itemDef.type === 'face') {
                    accItem.innerText = itemDef.emoji;
                    accItem.style.display = 'block';
                } else if (itemDef.type === 'head') {
                    // Nếu không phải Chủ nhật 7 lá thì thay thế trái cam
                    if (!(isSunday && sysData.weeklyStreak === 7)) {
                        headItem.innerText = itemDef.emoji;
                    }
                    accItem.style.display = 'none';
                }
            } else {
                accItem.style.display = 'none';
            }
        }

        // --- 6. LOGIC BỘ ĐẾM VIEW ---
        let baseViews = 142; 
        let localVisits = localStorage.getItem('kapi_visits');
        localVisits = !localVisits ? 1 : parseInt(localVisits) + 1;
        localStorage.setItem('kapi_visits', localVisits);
        
        // Đợi DOM load xong mới gán số view (tránh lỗi null)
        document.addEventListener('DOMContentLoaded', () => {
            const viewSpan = document.getElementById('fake-views');
            if(viewSpan) viewSpan.innerText = baseViews + localVisits;
            initSystem();
        });

    </script>
</body>
</html>
