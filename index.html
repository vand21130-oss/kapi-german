<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapi - Deutsch B2</title>
    
    <!-- Gọi 3 "bộ não" của Kapi (thêm defer để tránh lỗi Timeout) -->
    <script src="vokabel-data.js" defer></script>

    <style>
        /* TẠO LỚP NỀN CUTE */
        /* Ép nền và hòa tan bằng "lệnh bài" !important */
        body {
            background-image: url('bg-pattern.jpg') !important;
            background-repeat: repeat !important;
            background-size: 300px !important;
            background-attachment: fixed !important;
            margin:0; 
            min-height:100vh; 
            display:flex; 
            flex-direction:column; 
            justify-content:center; 
            align-items:center; 
            text-align:center; 
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding-bottom: 50px;
        }

        body::before {
            content: "" !important;
            position: fixed !important;
            top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important;
            background: rgba(255, 255, 255, 0.7) !important;
            z-index: -1 !important;
        }

        .kapi-img {
            mix-blend-mode: multiply !important; /* Hòa tan nền trắng */
        }

        /* ========================================= */
        /* HỆ THỐNG WIDGET SHOP & LÁ GÓC TRÁI/PHẢI     */
        /* ========================================= */
        .widget-panel {
            position: fixed;
            top: 25px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 3px dashed #ffcc80;
            border-radius: 22px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(211, 84, 0, 0.08);
            z-index: 100;
            width: 210px;
            backdrop-filter: blur(4px);
        }
        .widget-right { right: 25px; text-align: center; }
        .widget-left { left: 25px; text-align: left; }

        .total-leaves { 
            font-weight: 800; 
            margin-bottom: 10px; 
            color: #d35400; 
            font-size: 15px; 
            text-align: center; 
            background: #ffe0b2;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
        }
        .leaves-container { display: flex; justify-content: center; gap: 4px; margin: 10px 0; font-size: 16px; }
        .leaf { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: flex-start; min-width: 22px; line-height: 1; }
        .leaf.leaf-missed { filter: grayscale(.35); opacity: .82; }
        .leaf.leaf-missed::after { content: ""; position: absolute; top: 8px; left: 0; width: 24px; height: 2px; border-radius: 2px; background: #e53935; transform: rotate(-48deg); box-shadow: 0 0 0 1px rgba(255,255,255,.65); }
        .leaf .missed-face { margin-top: 3px; color: #c62828; font-size: 9px; font-weight: 900; letter-spacing: -1px; }
        
        .btn-action {
            background-color: #4CAF50; color: white; border: none; padding: 8px 10px;
            border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s;
            box-shadow: 0 3px 0 #2e7d32; font-size: 13px;
        }
        .btn-action:disabled { background-color: #e0e0e0; color: #9e9e9e; cursor: not-allowed; box-shadow: none; transform: translateY(3px); }
        .btn-action:hover:not(:disabled) { background-color: #45a049; transform: translateY(1px); box-shadow: 0 2px 0 #2e7d32; }

        #shop-items-container {
            max-height: 245px; 
            overflow-y: auto;  
            padding-right: 5px;
        }
        #shop-items-container::-webkit-scrollbar { width: 4px; }
        #shop-items-container::-webkit-scrollbar-track { background: transparent; }
        #shop-items-container::-webkit-scrollbar-thumb { background: #ffcc80; border-radius: 10px; }

        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #fffaf0; padding: 6px 10px;
            border-radius: 10px; margin-bottom: 6px; font-size: 13px;
            font-weight: bold; color: #555;
        }
        .shop-item button {
            background: #ffb74d; color: white; border: none; border-radius: 6px; padding: 4px 8px;
            cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s;
        }
        .shop-item button:disabled { background: #f5f5f5; color: #ccc; cursor: not-allowed; }
        .shop-item button.equipped { background: #4CAF50; color: white; }
        .shop-item button.preview-scene { background:#8d6e63; color:white; min-width:38px; }

        /* Phụ kiện Kapi */
        .kapi-head {
            position: absolute; top: 38px; left: 50%; transform: translateX(-50%);
            width: 150px; height: 80px; z-index: 10; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; display: none;
        }
        .shop-item.locked-item { opacity: .72; }
        .shop-item-info { min-width: 0; padding-right: 6px; }
        .shop-item-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shop-item-rule { display: block; margin-top: 2px; color: #9b7b6d; font-size: 9px; font-weight: 700; }
        .shop-week-title { margin: 2px 0 7px; color: #9b6b4b; font-size: 10px; font-weight: 900; text-align: center; letter-spacing: .4px; }
        .shop-owned-title { margin: 8px 0 5px; padding-top: 6px; border-top: 1px dashed #efc99d; color: #79905a; font-size: 10px; font-weight: 900; text-align: center; }
        .kapi-head.flower::before {
            content: ""; position: absolute; top: 9px; right: 9px; width: 21px; height: 21px;
            border-radius: 50%; background: #ffd54f; border: 3px solid #7b3d54;
            box-shadow: 0 -16px 0 2px #ff8fba, 0 16px 0 2px #ff8fba,
                        16px 0 0 2px #ff8fba, -16px 0 0 2px #ff8fba;
            transform: rotate(8deg);
        }
        .kapi-head.top-hat::before {
            content: ""; position: absolute; top: -35px; left: 42px; width: 67px; height: 69px;
            border: 5px solid #24170f; border-radius: 9px 9px 4px 4px;
            background: linear-gradient(to bottom, #303030 0 68%, #f0a23c 68% 82%, #171717 82%);
            box-sizing: border-box; transform: rotate(-3deg);
        }
        .kapi-head.top-hat::after {
            content: ""; position: absolute; top: 27px; left: 24px; width: 104px; height: 16px;
            border: 5px solid #24170f; border-radius: 50%; background: #202020;
        }
        .kapi-head.headband::before {
            content: ""; position: absolute; top: 17px; left: 9px; width: 132px; height: 37px;
            box-sizing: border-box; border: 7px solid #f7c7a6; border-bottom: 0;
            border-radius: 70px 70px 0 0; transform: rotate(-2deg);
            box-shadow: inset 0 5px 0 rgba(255,255,255,.55);
        }
        .kapi-head.crown {
            top: 19px; width: 98px; height: 65px;
            background: linear-gradient(145deg, #ffe66b, #f4a825); border: 4px solid #8a5100;
            clip-path: polygon(0 20%, 24% 55%, 40% 5%, 61% 55%, 88% 12%, 100% 100%, 0 100%);
            filter: drop-shadow(0 4px 0 rgba(91,50,0,.2));
        }
        .kapi-accessory {
            position: absolute; top: 127px; left: 50%; transform: translateX(-50%);
            width: 146px; height: 60px; z-index: 11; pointer-events: none; display: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .kapi-accessory.sunglasses .glass-lens {
            position: absolute; top: 3px; width: 56px; height: 43px;
            box-sizing: border-box; background: linear-gradient(145deg, #263238 8%, #111 68%);
            border: 6px solid #24170f; border-radius: 15px 15px 21px 21px;
            box-shadow: inset 8px 6px 0 rgba(255,255,255,.16), 0 3px 2px rgba(54,31,16,.2);
        }
        .kapi-accessory.sunglasses.mint .glass-lens { background: linear-gradient(145deg,#b9fff0 5%,#45bda7 72%); border-color:#285b57; }
        .kapi-accessory.sunglasses.mint .glass-bridge,
        .kapi-accessory.sunglasses.mint::before,
        .kapi-accessory.sunglasses.mint::after { border-color:#285b57; background:#285b57; }
        .kapi-accessory.sunglasses.rose .glass-lens { background: linear-gradient(145deg,#ffd7e5 5%,#ea6f99 72%); border-color:#71364d; }
        .kapi-accessory.sunglasses.rose .glass-bridge,
        .kapi-accessory.sunglasses.rose::before,
        .kapi-accessory.sunglasses.rose::after { border-color:#71364d; background:#71364d; }
        .kapi-head.flower.blue::before {
            background:#fff2a5; border-color:#315b79;
            box-shadow:0 -16px 0 2px #79c9f2,0 16px 0 2px #79c9f2,16px 0 0 2px #79c9f2,-16px 0 0 2px #79c9f2;
        }
        .kapi-head.beret::before {
            content:""; position:absolute; top:-5px; left:29px; width:96px; height:50px;
            background:linear-gradient(145deg,#d99869,#a95b43); border:5px solid #6d382d;
            border-radius:60% 45% 38% 40%; transform:rotate(-7deg); box-sizing:border-box;
        }
        .kapi-head.beret::after {
            content:""; position:absolute; top:-13px; left:73px; width:12px; height:17px;
            background:#6d382d; border-radius:8px 8px 2px 2px; transform:rotate(-12deg);
        }
        .kapi-accessory.sunglasses .glass-lens.left { left: 10px; transform: rotate(2deg); }
        .kapi-accessory.sunglasses .glass-lens.right { right: 10px; transform: rotate(-2deg); }
        .kapi-accessory.sunglasses .glass-bridge {
            position: absolute; top: 20px; left: 61px; width: 24px; height: 8px;
            border-top: 6px solid #24170f; border-radius: 50%;
        }
        .kapi-accessory.sunglasses::before,
        .kapi-accessory.sunglasses::after {
            content: ""; position: absolute; top: 13px; width: 20px; height: 6px;
            background: #24170f; border-radius: 5px;
        }
        .kapi-accessory.sunglasses::before { left: -1px; transform: rotate(13deg); }
        .kapi-accessory.sunglasses::after { right: -1px; transform: rotate(-13deg); }
        .kapi-accessory.star-glasses {
            top: 127px; width: 142px; height: 57px;
        }
        .kapi-accessory.star-glasses .star-lens {
            position: absolute; top: 1px; width: 55px; height: 52px;
            background: linear-gradient(145deg, #fff36b, #ffb300); border: 4px solid #6d3d00;
            box-sizing: border-box;
            clip-path: polygon(50% 0,61% 34%,98% 35%,68% 56%,79% 94%,50% 71%,20% 94%,31% 57%,2% 35%,39% 34%);
            filter: drop-shadow(0 3px 0 rgba(109,61,0,.25));
        }
        .kapi-accessory.star-glasses .star-lens.left { left: 9px; transform: rotate(-6deg); }
        .kapi-accessory.star-glasses .star-lens.right { right: 9px; transform: rotate(6deg); }
        .kapi-accessory.star-glasses .star-bridge {
            position: absolute; top: 23px; left: 59px; width: 24px; border-top: 6px solid #6d3d00;
        }
        .kapi-heart {
            position: absolute; top: 112px; left: calc(50% + 64px); z-index: 20;
            font-size: 42px; pointer-events: none; animation: kapi-heart-float 1.5s ease-out forwards;
        }
        .kapi-activity-layer {
            position:absolute; inset:0; z-index:12; pointer-events:none; display:none;
        }
        .kapi-sleep-image {
            position:absolute; left:50%; bottom:2px; width:560px; max-width:112vw;
            height:auto; z-index:7; display:none; pointer-events:none;
            transform:translateX(-50%); transform-origin:50% 100%;
            filter:drop-shadow(0 8px 5px rgba(92,61,33,.12));
        }
        .kapi-activity-layer .scene-prop,
        .kapi-activity-layer .scene-fx { position:absolute; }
        .kapi-activity-layer.radio-scene { display:block; }
        .radio-scene .scene-prop {
            right:29px; bottom:70px; width:76px; height:55px; border:5px solid #58392b;
            border-radius:12px; background:linear-gradient(145deg,#f7b85b,#c7773e);
            box-shadow:0 5px 0 rgba(70,38,27,.18);
        }
        .radio-scene .scene-prop::before {
            content:""; position:absolute; left:9px; top:12px; width:27px; height:27px;
            border:4px solid #58392b; border-radius:50%; background:repeating-radial-gradient(#67483a 0 2px,#d9a46d 3px 5px);
        }
        .radio-scene .scene-prop::after {
            content:""; position:absolute; right:8px; top:12px; width:18px; height:8px;
            border-top:4px solid #58392b; border-bottom:4px solid #58392b;
        }
        .radio-scene .scene-fx { right:42px; bottom:130px; color:#8e44ad; font-size:29px; animation:kapi-notes 1.7s ease-out infinite; }
        .kapi-container.kapi-scene-radio .kapi-img { animation:kapi-music-sway 1.1s ease-in-out infinite !important; transform-origin:50% 100%; }

        .kapi-activity-layer.cocoa-scene { display:block; }
        .cocoa-scene .scene-prop {
            right:55px; bottom:86px; width:55px; height:42px; border:5px solid #6e3e2b;
            border-radius:7px 7px 18px 18px; background:#a9e0d1;
        }
        .cocoa-scene .scene-prop::before {
            content:""; position:absolute; right:-22px; top:6px; width:22px; height:21px;
            border:5px solid #6e3e2b; border-left:0; border-radius:0 50% 50% 0;
        }
        .cocoa-scene .scene-prop::after {
            content:"~  ~"; position:absolute; left:4px; top:-37px; width:55px; color:#fff;
            font-size:23px; font-weight:900; animation:kapi-steam 1.8s ease-in-out infinite;
        }
        .kapi-container.kapi-scene-cocoa .kapi-img { animation:kapi-cocoa-sip 2.3s ease-in-out infinite !important; transform-origin:50% 100%; }

        .kapi-activity-layer.sleep-scene { display:block; }
        .kapi-container.kapi-scene-sleep .kapi-sleep-image {
            display:block; animation:kapi-sleep-image-breathe 2.8s ease-in-out infinite;
        }
        .kapi-container.kapi-scene-sleep > .kapi-img { visibility:hidden; }
        .kapi-container.kapi-scene-sleep > .kapi-head,
        .kapi-container.kapi-scene-sleep > .kapi-accessory,
        .kapi-container.kapi-scene-sleep > .kapi-decor-grass { visibility:hidden; }
        .kapi-container.kapi-scene-sleep .sleep-scene .scene-prop { display:none; }
        .sleep-scene .scene-prop {
            left:auto; right:-12px; bottom:65px; width:112px; height:98px;
            box-sizing:border-box; border:5px solid #9b784f;
            border-radius:28px 19px 31px 17px;
            background:radial-gradient(circle at 48% 43%,#fff9d4 0 20%,#f8dfa0 58%,#e8c071 100%);
            box-shadow:inset 8px 8px 14px rgba(255,255,255,.55),inset -8px -8px 12px rgba(177,122,53,.18),0 9px 0 rgba(103,71,39,.14);
            transform:rotate(7deg);
            animation:kapi-pillow-squish 2.8s ease-in-out infinite;
        }
        .sleep-scene .scene-prop::before {
            content:""; position:absolute; inset:9px; border:2px dashed rgba(145,103,57,.42);
            border-radius:21px 13px 24px 12px;
        }
        .sleep-scene .scene-prop::after {
            content:"♥"; position:absolute; left:39px; top:29px; color:#dc8c91;
            font-size:27px; line-height:1; text-shadow:0 2px 0 rgba(117,69,58,.16);
        }
        .sleep-scene .scene-fx { right:9px; top:92px; color:#6977ad; font-size:31px; font-weight:900; z-index:15; animation:kapi-zzz 2s ease-in-out infinite; }

        .kapi-activity-layer.mirror-scene { display:block; }
        .mirror-scene .scene-prop {
            right:35px; bottom:75px; width:66px; height:82px; box-sizing:border-box;
            border:7px solid #d69b35; border-radius:50%; background:linear-gradient(145deg,#e9fbff,#9ed4df);
            animation:kapi-mirror-tilt 2.2s ease-in-out infinite;
        }
        .mirror-scene .scene-prop::after {
            content:""; position:absolute; left:24px; bottom:-37px; width:10px; height:38px;
            border-radius:7px; background:#8b572f;
        }
        .mirror-scene .scene-fx { right:20px; top:88px; color:#ffd54f; font-size:31px; animation:kapi-sparkle 1.5s ease-in-out infinite; }
        .kapi-container.kapi-scene-mirror .kapi-img { animation:kapi-proud-pose 2.2s ease-in-out infinite !important; transform-origin:50% 100%; }

        @keyframes kapi-notes { 0%{opacity:0;transform:translate(0,15px) scale(.7)} 35%{opacity:1} 100%{opacity:0;transform:translate(-25px,-55px) scale(1.15)} }
        @keyframes kapi-music-sway { 0%,100%{transform:rotate(-1.8deg)} 50%{transform:rotate(1.8deg) translateY(-4px)} }
        @keyframes kapi-steam { 0%,100%{opacity:.25;transform:translateY(5px)} 50%{opacity:1;transform:translateY(-7px)} }
        @keyframes kapi-cocoa-sip { 0%,100%{transform:rotate(0)} 38%,55%{transform:rotate(2deg) translate(4px,-3px)} }
        @keyframes kapi-zzz { 0%{opacity:0;transform:translate(0,12px) scale(.7)} 45%{opacity:1} 100%{opacity:0;transform:translate(22px,-42px) scale(1.15)} }
        @keyframes kapi-sleep-breathe { 0%,100%{transform:translateX(0) rotate(0) scale(1)} 50%{transform:translateX(7px) rotate(1.2deg) scale(1.012,.995) translateY(3px)} }
        @keyframes kapi-pillow-squish { 0%,100%{transform:rotate(7deg) scale(1)} 50%{transform:rotate(4deg) scale(.96,1.035)} }
        @keyframes kapi-sleep-image-breathe {
            0%,100%{transform:translateX(-50%) scale(1) translateY(0)}
            50%{transform:translateX(-50%) scale(1.012,.995) translateY(3px)}
        }
        @keyframes kapi-mirror-tilt { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(7deg) translateY(-5px)} }
        @keyframes kapi-sparkle { 0%,100%{opacity:.25;transform:scale(.7) rotate(0)} 50%{opacity:1;transform:scale(1.2) rotate(25deg)} }
        @keyframes kapi-proud-pose { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-1.5deg) translateY(-5px)} }
        .kapi-container.kapi-got-gift .kapi-img {
            animation: kapi-gift-bounce 1.05s cubic-bezier(.22,.9,.32,1.2) both !important;
            transform-origin: 50% 100%;
        }
        .kapi-container.kapi-got-gift .kapi-accessory,
        .kapi-container.kapi-got-gift .kapi-head {
            animation: kapi-worn-gift-bounce 1.05s cubic-bezier(.22,.9,.32,1.2) both !important;
        }
        @keyframes kapi-heart-float {
            0% { opacity: 0; transform: translate(-8px, 18px) scale(.35) rotate(-12deg); }
            28% { opacity: 1; transform: translate(0, 0) scale(1.15) rotate(8deg); }
            100% { opacity: 0; transform: translate(24px, -92px) scale(.8) rotate(16deg); }
        }
        @keyframes kapi-gift-bounce {
            0% { transform: translateY(0) scale(1); }
            22% { transform: translateY(-34px) scale(1.045) rotate(-1.5deg); }
            43% { transform: translateY(0) scale(.985) rotate(0); }
            62% { transform: translateY(-17px) scale(1.02) rotate(1deg); }
            80% { transform: translateY(0) scale(.995); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes kapi-worn-gift-bounce {
            0% { transform: translateX(-50%) translateY(0) scale(1); }
            22% { transform: translateX(-50%) translateY(-34px) scale(1.045) rotate(-1.5deg); }
            43% { transform: translateX(-50%) translateY(0) scale(.985) rotate(0); }
            62% { transform: translateX(-50%) translateY(-17px) scale(1.02) rotate(1deg); }
            80% { transform: translateX(-50%) translateY(0) scale(.995); }
            100% { transform: translateX(-50%) translateY(0) scale(1); }
        }

        /* ========================================= */
        /* HIỆU ỨNG KAPI NHÚN NHẢY & BONG BÓNG THOẠI */
        /* ========================================= */

        .kapi-container {
            position: relative;
            display: inline-block;
            cursor: pointer; /* Biến chuột thành hình bàn tay */
            margin: 20px 0;
        }

        /* Kapi nhún nhảy */
        .kapi-img {
            width: 450px;
            max-width: 90%;
            height: auto;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Mượt và nảy nhẹ */
        }

        .kapi-container:hover .kapi-img {
            transform: translateY(-15px) scale(1.02); /* Nảy lên 15px và to ra một tẹo */
        }
        .kapi-container:hover .kapi-accessory,
        .kapi-container:hover .kapi-head {
            transform: translateX(-50%) translateY(-15px) scale(1.02);
        }

        /* Bong bóng thoại "Hallo" */
        .kapi-bubble {
            position: absolute;
            top: 10px;
            right: 20px; /* Căn nằm ngay cạnh đầu bé Kapi */
            background-color: transparent;
            border: 3px solid #ffb74d; /* Viền màu cam */
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 22px;
            font-weight: bold;
            color: #d35400;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            z-index: 10;
            
            /* Trạng thái ẩn ban đầu */
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.8);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* Hiệu ứng "pop up" nảy nảy */
        }

        /* Cái đuôi nhọn của bong bóng */
        .kapi-bubble::after {
            content: "";
            position: absolute;
            bottom: -12px;
            right: 40px; /* Chỉnh cái đuôi trỏ xuống gần đầu Kapi */
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #ffb74d transparent transparent transparent;
        }

        .kapi-bubble::before {
            content: "";
            position: absolute;
            bottom: -8px;
            right: 40px;
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
            z-index: 1;
        }

        /* Hiển thị bong bóng khi di chuột vào vùng chứa */
        .kapi-container:hover .kapi-bubble {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .btn-kapi { font-size:22px; padding:15px 25px; margin:10px; border-radius:20px; border:none; cursor:pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; color: #333; }
        .btn-kapi:hover { transform: translateY(-2px); box-shadow: 0 6px 10px rgba(0,0,0,0.1); }
        
        .btn-green { background: #dcedc8; }
        .btn-red { background: #ffcdd2; }
        .btn-home { background: #eee; }
        .btn-a1 { background: #e8f5e9; }

        /* HIỆU ỨNG CỎ ĐUNG ĐƯA BÊN DƯỚI KAPI        */
        /* ========================================= */
        /* Hiệu ứng cỏ đung đưa nhẹ nhàng */
        @keyframes waveGrass {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(8deg) translateY(-2px); }
            100% { transform: rotate(0deg); }
        }

        /* Thảm cỏ nằm ngay dưới chân ảnh Kapi, không bị trôi đi đâu nữa */
        .kapi-decor-grass {
            display: flex;
            justify-content: center;
            gap: 15px; /* Khoảng cách giữa các nhành cỏ */
            margin-top: -15px; /* Kéo thảm cỏ đè nhẹ lên mép dưới của ảnh Kapi cho tự nhiên */
            margin-bottom: 10px;
            font-size: 32px;
            pointer-events: none;
            position: relative;
            z-index: 5;
        }

        .decor-item {
            display: inline-block;
            animation: waveGrass 3s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .decor-item:nth-child(1) { animation-delay: 0s; }
        .decor-item:nth-child(2) { animation-delay: 0.5s; font-size: 26px; }
        .decor-item:nth-child(3) { animation-delay: 1s; font-size: 35px; }
        .decor-item:nth-child(4) { animation-delay: 1.5s; font-size: 28px; }
        .decor-item:nth-child(5) { animation-delay: 0.8s; }
        /* Kỹ thuật dán chết 2 chùm tia sáng vào 2 bên nút bấm */
        .btn-kapi-glow {
            position: relative;
        }

        /* Tia sáng bên trái */
        .btn-kapi-glow::before {
            content: "";
            position: absolute;
            left: -45px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 40px;
            background-image: 
                radial-gradient(circle, #689f38 60%, transparent 62%),
                radial-gradient(circle, #689f38 60%, transparent 62%),
                radial-gradient(circle, #689f38 60%, transparent 62%);
            /* Vẽ 3 vạch sáng chụm hướng ra ngoài */
            box-shadow: 
                -8px -12px 0 0 #689f38,
                -12px 0px 0 0 #689f38,
                -8px 12px 0 0 #689f38;
            border-radius: 50%;
            width: 4px;
            height: 4px;
            pointer-events: none;
        }

        /* Tia sáng bên phải */
        .btn-kapi-glow::after {
            content: "";
            position: absolute;
            right: -45px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 
                8px -12px 0 0 #689f38,
                12px 0px 0 0 #689f38,
                8px 12px 0 0 #689f38;
            border-radius: 50%;
            width: 4px;
            height: 4px;
            pointer-events: none;
        }

        /* FOCUS MODE: Kapi chào ở sảnh; khi học chỉ giữ nội dung và mascot chuyên môn. */

    <!-- LOGIC BỔ SUNG: SHOP, LÁ VÀ QUẢN LÝ ẨN/HIỆN THÔNG MINH                      -->
    <!-- ========================================================================= -->
    <script>
        const STORAGE_KEY = 'kapi_eco_system';
        const KAPI_PREVIEW_KEY = 'kapi_shop_previews_v2';
        
        let sysData = {
            totalLeaves: 0,
            weeklyStreak: 0,
            weeklyClaims: [],
            lastClaimDate: null,
            currentWeekStart: getMonday(new Date()).toDateString(),
            inventory: [],
            equippedItem: null,
            equippedItems: { face: null, head: null, activity: null },
            studyCompletions: 0,
            completedStudyDates: [],
            shopGiftMilestones: []
        };

        const shopItems = [
            { id:"item_glass", name:"Kính râm", icon:"🕶️", price:5, type:"face", look:"sunglasses", need:0 },
            { id:"item_flower", name:"Hoa đào", icon:"🌸", price:8, type:"head", look:"flower", need:1 },
            { id:"item_glass_mint", name:"Kính bạc hà", icon:"🍃", price:10, type:"face", look:"sunglasses mint", need:1 },
            { id:"item_hat", name:"Mũ quý ông", icon:"🎩", price:12, type:"head", look:"top-hat", need:2 },
            { id:"item_flower_blue", name:"Hoa trời xanh", icon:"🪻", price:12, type:"head", look:"flower blue", need:2 },
            { id:"item_band", name:"Băng đô nghỉ phép", icon:"🩹", price:14, type:"head", look:"headband", need:0, streak:3 },
            { id:"item_star", name:"Kính ngôi sao", icon:"⭐", price:16, type:"face", look:"star-glasses", need:3 },
            { id:"item_beret", name:"Mũ họa sĩ", icon:"🎨", price:18, type:"head", look:"beret", need:4 },
            { id:"item_glass_rose", name:"Kính hoàng hôn", icon:"🌇", price:20, type:"face", look:"sunglasses rose", need:5 },
            { id:"item_radio", name:"Radio tí hon", icon:"📻", price:16, type:"activity", look:"radio", need:3 },
            { id:"item_cocoa", name:"Cốc cacao", icon:"☕", price:14, type:"activity", look:"cocoa", need:2 },
            { id:"item_pillow", name:"Gối ngủ trưa", icon:"🛏️", price:18, type:"activity", look:"sleep", need:4 },
            { id:"item_mirror", name:"Gương tự tin", icon:"🪞", price:20, type:"activity", look:"mirror", need:5 }
        ];

        const KAPI_SHOP_REACTIONS = [
            'Steht mir gut, oder? 💗', 'Kapi đã soi gương ba lần rồi.',
            'Một món quà hợp pháp! 💗', 'Heute bin ich besonders schick!',
            'Kapi đồng ý tiếp tục làm mascot.'
        ];

        function getMonday(d) {
            let date = new Date(d);
            let day = date.getDay();
            let diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function initSystem() {
            let savedData = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (savedData) sysData = { ...sysData, ...savedData };
            if (!sysData.equippedItems) sysData.equippedItems = { face:null, head:null, activity:null };
            if (!Object.prototype.hasOwnProperty.call(sysData.equippedItems, 'activity')) sysData.equippedItems.activity = null;
            if (sysData.equippedItem) {
                const oldItem = shopItems.find(item => item.id === sysData.equippedItem);
                if (oldItem) sysData.equippedItems[oldItem.type] = oldItem.id;
                sysData.equippedItem = null;
            }
            if (!Array.isArray(sysData.completedStudyDates)) sysData.completedStudyDates = [];
            if (!Array.isArray(sysData.shopGiftMilestones)) sysData.shopGiftMilestones = [];
            
            checkResetWeek();
            migrateWeeklyClaims();
            renderLeavesUI();
            renderShopUI();
            updateKapiAppearance();
        }

        function checkResetWeek() {
            const thisMonday = getMonday(new Date()).toDateString();
            if (sysData.currentWeekStart !== thisMonday) {
                sysData.weeklyStreak = 0;
                sysData.weeklyClaims = [];
                sysData.currentWeekStart = thisMonday;
                saveData();
            }
        }

        function toLocalDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function migrateWeeklyClaims() {
            if (!Array.isArray(sysData.weeklyClaims)) sysData.weeklyClaims = [];
            // Giữ lại lượt điểm danh gần nhất của dữ liệu cũ thay vì xóa thành tích của người dùng.
            if (!sysData.weeklyClaims.length && sysData.lastClaimDate) {
                const oldDate = new Date(sysData.lastClaimDate);
                const monday = getMonday(new Date());
                monday.setHours(0, 0, 0, 0);
                if (!Number.isNaN(oldDate.getTime()) && oldDate >= monday && oldDate <= new Date()) {
                    sysData.weeklyClaims.push(toLocalDateKey(oldDate));
                }
            }
            sysData.weeklyClaims = [...new Set(sysData.weeklyClaims)];
            sysData.weeklyStreak = sysData.weeklyClaims.length;
            saveData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sysData));
        }

        function claimDailyLeaf() {
            const todayStr = new Date().toDateString();
            const todayKey = toLocalDateKey(new Date());
            if (sysData.lastClaimDate === todayStr || sysData.weeklyClaims.includes(todayKey)) return;

            sysData.weeklyClaims.push(todayKey);
            sysData.weeklyStreak = sysData.weeklyClaims.length;
            sysData.totalLeaves += 1;
            sysData.lastClaimDate = todayStr;
            
            saveData();
            renderLeavesUI();
            renderShopUI();
            updateKapiAppearance();
        }

        function renderLeavesUI() {
            document.getElementById('total-leaves-count').innerText = sysData.totalLeaves;

            const now = new Date();
            const monday = getMonday(now);
            monday.setHours(0, 0, 0, 0);
            const todayKey = toLocalDateKey(now);

            for (let i = 1; i <= 7; i++) {
                const leaf = document.getElementById(`day-${i}`);
                if (!leaf) continue;
                const date = new Date(monday);
                date.setDate(monday.getDate() + i - 1);
                const dateKey = toLocalDateKey(date);
                const claimed = sysData.weeklyClaims.includes(dateKey);
                const missed = dateKey < todayKey && !claimed;
                leaf.classList.toggle('leaf-missed', missed);
                leaf.title = claimed ? 'Đã điểm danh 🌿' : missed ? 'Đã bỏ lỡ :(' : dateKey === todayKey ? 'Hôm nay đang chờ điểm danh' : 'Chưa tới ngày';
                leaf.innerHTML = claimed ? '🌿' : missed ? '🍂<small class="missed-face">:(</small>' : '🍂';
            }

            const btnClaim = document.getElementById('btn-claim-leaf');
            if(btnClaim) {
                if (sysData.lastClaimDate === new Date().toDateString()) {
                    btnClaim.disabled = true;
                    btnClaim.innerText = "Đã điểm danh";
                } else {
                    btnClaim.disabled = false;
                    btnClaim.innerText = "🌿 Điểm danh ngay";
                }
            }
        }

        function renderShopUI() {
            const container = document.getElementById('shop-items-container');
            if(!container) return;
            container.innerHTML = '<div class="shop-week-title">✨ BA MÓN GHÉ SHOP TUẦN NÀY</div>';
            const featured = getWeeklyShopItems();
            featured.forEach(item => container.insertAdjacentHTML('beforeend', renderShopItem(item)));
            const owned = shopItems.filter(item => sysData.inventory.includes(item.id) && !featured.some(feature => feature.id === item.id));
            if (owned.length) {
                container.insertAdjacentHTML('beforeend','<div class="shop-owned-title">🎒 TỦ ĐỒ CỦA KAPI</div>');
                owned.forEach(item => container.insertAdjacentHTML('beforeend', renderShopItem(item)));
            }
        }

        function getWeeklyShopItems() {
            const monday = getMonday(new Date());
            const seed = Number(`${monday.getFullYear()}${String(monday.getMonth()+1).padStart(2,'0')}${String(monday.getDate()).padStart(2,'0')}`);
            const fashion = shopItems.filter(item => item.type !== 'activity');
            const activities = shopItems.filter(item => item.type === 'activity');
            for (let i = fashion.length - 1; i > 0; i--) {
                const j = (seed + i * 17 + Math.floor(seed / (i + 1))) % (i + 1);
                [fashion[i], fashion[j]] = [fashion[j], fashion[i]];
            }
            return [...fashion.slice(0, 2), activities[seed % activities.length]];
        }

        function getItemRequirement(item) {
            if (item.streak && sysData.weeklyStreak < item.streak) return `Cần điểm danh ${item.streak} ngày`;
            if ((sysData.studyCompletions || 0) < (item.need || 0)) return `Cần học thật ${item.need} buổi`;
            return '';
        }

        function renderShopItem(item) {
            const isOwned = sysData.inventory.includes(item.id);
            const isEquipped = sysData.equippedItems[item.type] === item.id;
            const canAfford = sysData.totalLeaves >= item.price;
            const requirement = isOwned ? '' : getItemRequirement(item);
            let btnHTML = '';
            if (isEquipped) btnHTML = `<button class="equipped" onclick="equipItem('${item.id}')">Đang mặc</button>`;
            else if (isOwned) btnHTML = `<button onclick="equipItem('${item.id}')">Mặc</button>`;
            else if (requirement && item.type === 'activity' && !hasPreviewedKapiActivity(item.id)) btnHTML = `<button class="preview-scene" title="Xem thử một lần" onclick="previewKapiActivity('${item.id}')">👀</button>`;
            else if (requirement && item.type === 'activity') btnHTML = '<button disabled title="Đã dùng lượt xem thử">✓</button>';
            else if (requirement) btnHTML = '<button disabled>🔒</button>';
            else btnHTML = `<button ${!canAfford ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price})">${canAfford ? 'Mua (' + item.price + ' 🍃)' : '🔒 ' + item.price + ' 🍃'}</button>`;
            return `<div class="shop-item ${requirement ? 'locked-item' : ''}">
                <span class="shop-item-info"><span class="shop-item-name">${item.icon} ${item.name}</span>${requirement ? `<small class="shop-item-rule">${requirement}</small>` : ''}</span>${btnHTML}
            </div>`;
        }

        function buyItem(id, price) {
            const item = shopItems.find(entry => entry.id === id);
            if (item && !getItemRequirement(item) && sysData.totalLeaves >= price) {
                sysData.totalLeaves -= price;
                if (!sysData.inventory.includes(id)) sysData.inventory.push(id);
                sysData.equippedItems[item.type] = id;
                saveData();
                renderLeavesUI();
                renderShopUI();
                updateKapiAppearance();
                celebrateKapiNewItem();
            }
        }

        function celebrateKapiNewItem() {
            const kapi = document.querySelector('.kapi-container');
            if (!kapi) return;
            kapi.classList.remove('kapi-got-gift');
            void kapi.offsetWidth;
            kapi.classList.add('kapi-got-gift');

            const oldHeart = kapi.querySelector('.kapi-heart');
            if (oldHeart) oldHeart.remove();
            const heart = document.createElement('span');
            heart.className = 'kapi-heart';
            heart.textContent = '💗';
            heart.setAttribute('aria-label', 'Kapi rất thích món quà mới');
            kapi.appendChild(heart);
            const bubble = kapi.querySelector('.kapi-bubble');
            if (bubble) bubble.textContent = KAPI_SHOP_REACTIONS[Math.floor(Math.random() * KAPI_SHOP_REACTIONS.length)];
            window.setTimeout(() => {
                heart.remove();
                kapi.classList.remove('kapi-got-gift');
            }, 1900);
        }

        function equipItem(id) {
            const item = shopItems.find(entry => entry.id === id);
            if (!item || !sysData.inventory.includes(id)) return;
            sysData.equippedItems[item.type] = sysData.equippedItems[item.type] === id ? null : id;
            saveData();
            renderShopUI();
            updateKapiAppearance();
        }

        function updateKapiAppearance() {
            const headItem = document.getElementById('kapi-head-item');
            const accItem = document.getElementById('kapi-accessory');
            const isSunday = new Date().getDay() === 0;

            if (headItem && isSunday && sysData.weeklyStreak === 7) {
                headItem.className = "kapi-head crown";
                headItem.innerHTML = "";
                headItem.style.display = "block";
                headItem.style.animation = "bounce 1s infinite alternate";
            } else if(headItem) {
                headItem.className = "kapi-head";
                headItem.innerHTML = "";
                headItem.style.display = "none";
                headItem.style.animation = "none";
            }

            const faceItem = shopItems.find(item => item.id === sysData.equippedItems.face);
            const equippedHead = shopItems.find(item => item.id === sysData.equippedItems.head);
            if (faceItem && accItem) {
                accItem.className = 'kapi-accessory';
                faceItem.look.split(' ').forEach(name => accItem.classList.add(name));
                accItem.innerHTML = faceItem.look.includes('sunglasses')
                    ? '<span class="glass-lens left"></span><span class="glass-bridge"></span><span class="glass-lens right"></span>'
                    : '<span class="star-lens left"></span><span class="star-bridge"></span><span class="star-lens right"></span>';
                accItem.style.display = 'block';
            } else if(accItem) {
                accItem.className = 'kapi-accessory';
                accItem.innerHTML = '';
                accItem.style.display = 'none';
            }
            if (equippedHead && headItem && !(isSunday && sysData.weeklyStreak === 7)) {
                headItem.className = 'kapi-head';
                equippedHead.look.split(' ').forEach(name => headItem.classList.add(name));
                headItem.innerHTML = '';
                headItem.style.display = 'block';
            }
            updateKapiActivity();
        }

        function updateKapiActivity() {
            const kapi = document.querySelector('.kapi-container');
            const layer = document.getElementById('kapi-activity');
            if (!kapi || !layer) return;
            ['radio','cocoa','sleep','mirror'].forEach(scene => kapi.classList.remove(`kapi-scene-${scene}`));
            layer.className = 'kapi-activity-layer';
            const item = shopItems.find(entry => entry.id === sysData.equippedItems.activity);
            if (!item) return;
            kapi.classList.add(`kapi-scene-${item.look}`);
            layer.classList.add(`${item.look}-scene`);
            const fx = layer.querySelector('.scene-fx');
            if (fx) fx.textContent = item.look === 'radio' ? '♫ ♪' : item.look === 'sleep' ? 'Z z z' : item.look === 'mirror' ? '✦' : '';
        }

        let kapiPreviewTimer = null;
        function getKapiActivityPreviews() {
            try { return JSON.parse(localStorage.getItem(KAPI_PREVIEW_KEY)) || []; }
            catch (_) { return []; }
        }

        function hasPreviewedKapiActivity(id) {
            return getKapiActivityPreviews().includes(id);
        }

        function previewKapiActivity(id) {
            const item = shopItems.find(entry => entry.id === id && entry.type === 'activity');
            const kapi = document.querySelector('.kapi-container');
            const layer = document.getElementById('kapi-activity');
            if (!item || !kapi || !layer || hasPreviewedKapiActivity(id)) return;
            const previews = getKapiActivityPreviews();
            previews.push(id);
            localStorage.setItem(KAPI_PREVIEW_KEY, JSON.stringify(previews));
            renderShopUI();
            if (kapiPreviewTimer) window.clearTimeout(kapiPreviewTimer);
            ['radio','cocoa','sleep','mirror'].forEach(scene => kapi.classList.remove(`kapi-scene-${scene}`));
            layer.className = `kapi-activity-layer ${item.look}-scene`;
            kapi.classList.add(`kapi-scene-${item.look}`);
            const fx = layer.querySelector('.scene-fx');
            if (fx) fx.textContent = item.look === 'radio' ? '♫ ♪' : item.look === 'sleep' ? 'Z z z' : item.look === 'mirror' ? '✦' : '';
            const bubble = kapi.querySelector('.kapi-bubble');
            if (bubble) bubble.textContent = 'Bản dùng thử 5 giây thôi nhé! 👀';
            kapiPreviewTimer = window.setTimeout(() => {
                updateKapiActivity();
                if (bubble) bubble.textContent = 'Vali đã thu đạo cụ lại. 🫩';
            }, 5000);
        }

        function kapiRecordStudyCompletion(skillId) {
            const key = `${toLocalDateKey(new Date())}:${skillId || 'study'}`;
            if (sysData.completedStudyDates.includes(key)) return;
            sysData.completedStudyDates.push(key);
            sysData.studyCompletions = (sysData.studyCompletions || 0) + 1;
            const milestone = Math.floor(sysData.studyCompletions / 4);
            if (milestone > 0 && !sysData.shopGiftMilestones.includes(milestone)) {
                sysData.shopGiftMilestones.push(milestone);
                sysData.totalLeaves += 2;
                const bubble = document.querySelector('.kapi-bubble');
                if (bubble) bubble.textContent = 'Hộp quà học thật: +2 lá! 🎁';
            }
            saveData();
            renderLeavesUI();
            renderShopUI();
        }
        window.kapiRecordStudyCompletion = kapiRecordStudyCompletion;

        // --- HỆ THỐNG QUÉT ẨN/HIỆN WIDGET DỰA TRÊN MÀN HÌNH ---
        function checkAndToggleWidgets() {
            const widgetsGroup = document.getElementById('kapi-eco-widgets');
            const container = document.getElementById('container');
            const message = document.getElementById('message');
            
            if (widgetsGroup && container && message) {
                // Shop và bảng lá chỉ xuất hiện ở đúng sảnh chào ban đầu.
                const isHalloHall = message.textContent.trim() === "Guten Morgen! Schön, dich kennenzulernen! 🌟";
                const isMainContainerVisible = window.getComputedStyle(container).display !== 'none';
                widgetsGroup.style.display = isHalloHall && isMainContainerVisible ? 'block' : 'none';
            }
        }

        // Chạy quét liên tục mỗi 0.2s để bắt mọi thao tác bấm nút chuyển màn hình của Vịt một cách tự động hoàn toàn
        setInterval(checkAndToggleWidgets, 200);

        document.addEventListener('DOMContentLoaded', () => {
            initSystem();
            checkAndToggleWidgets();
            // Nếu trang mở qua nửa đêm, ngày bị bỏ lỡ sẽ tự gạch mà không cần tải lại.
            setInterval(renderLeavesUI, 60000);
        });
    </script>
</body>
